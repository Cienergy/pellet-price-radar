name: Price crawl (15 min)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-crawl
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run crawl
      - name: Commit prices if changed
        run: |
          git config user.name "pellet-price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/prices.json
          if git diff --staged --quiet; then
            echo "No price changes"
          else
            git commit -m "chore: refresh pellet price series"
            git push
          fi
